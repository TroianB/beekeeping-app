<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#facc15" />
    <title>Beekeeping App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Apiaries table alignment. Keep labels and values locked to the same columns. */
      #root input[placeholder="Search apiaries..."] + div > div.grid,
      #root input[placeholder="Search apiaries..."] + div > div > div.grid {
        grid-template-columns: 24px 150px 76px 66px 66px !important;
        justify-content: start !important;
        align-items: center !important;
      }

      #root input[placeholder="Search apiaries..."] + div > div.grid > *,
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > * {
        min-width: 0 !important;
      }

      /* Make each apiary row larger and easier to tap/read. */
      #root input[placeholder="Search apiaries..."] + div > div > div.grid {
        min-height: 3.4rem !important;
        padding-top: 0.8rem !important;
        padding-bottom: 0.8rem !important;
        border-bottom: 1px solid rgba(250, 204, 21, 0.1) !important;
      }

      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(2) {
        font-size: 0.98rem !important;
        font-weight: 700 !important;
      }

      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(3),
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(4),
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(5) {
        font-size: 0.9rem !important;
        font-weight: 800 !important;
      }

      /* Alternating row colours for readability. */
      #root input[placeholder="Search apiaries..."] + div > div > div.grid:nth-child(odd) {
        background: rgba(250, 204, 21, 0.055) !important;
      }

      #root input[placeholder="Search apiaries..."] + div > div > div.grid:nth-child(even) {
        background: rgba(0, 0, 0, 0.32) !important;
      }

      #root input[placeholder="Search apiaries..."] + div > div > div.grid:hover {
        background: rgba(250, 204, 21, 0.12) !important;
      }

      /* Visual order: Apiary | Singles | Doubles | Total Hives */
      #root input[placeholder="Search apiaries..."] + div > div.grid > *:nth-child(1),
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > *:nth-child(1) {
        order: 1 !important;
      }

      #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(2),
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(2) {
        order: 2 !important;
      }

      #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(5),
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(5) {
        order: 3 !important;
      }

      #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(4),
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(4) {
        order: 4 !important;
      }

      #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(3),
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(3) {
        order: 5 !important;
      }

      /* Centre metric labels and the matching numbers under them. */
      #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(3),
      #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(4),
      #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(5),
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(3),
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(4),
      #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(5) {
        text-align: center !important;
        justify-self: stretch !important;
        grid-column: auto !important;
      }

      #root input[placeholder="Search apiaries..."] + div > div.grid span {
        white-space: normal !important;
        line-height: 1.05 !important;
      }

      /* Small screens: Apiary label at left, values centred under their labels. */
      @media (max-width: 768px) {
        #root input[placeholder="Search apiaries..."] + div > div.grid,
        #root input[placeholder="Search apiaries..."] + div > div > div.grid {
          grid-template-columns: 20px minmax(68px, 1fr) 76px 64px 64px !important;
          gap: 0.5rem !important;
        }

        #root input[placeholder="Search apiaries..."] + div > div > div.grid {
          min-height: 3.75rem !important;
          padding-top: 0.9rem !important;
          padding-bottom: 0.9rem !important;
        }

        #root input[placeholder="Search apiaries..."] + div > div.grid > span:first-child {
          display: none !important;
        }

        #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(2) {
          grid-column: 1 / 3 !important;
          text-align: left !important;
          justify-self: stretch !important;
          padding-left: 0 !important;
        }

        #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(3),
        #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(4),
        #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(5) {
          font-size: 0.66rem !important;
          text-align: center !important;
          white-space: normal !important;
          line-height: 1.05 !important;
        }

        #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(2) {
          font-size: 0.95rem !important;
        }

        #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(3),
        #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(4),
        #root input[placeholder="Search apiaries..."] + div > div > div.grid > span:nth-child(5) {
          font-size: 0.82rem !important;
          text-align: center !important;
        }
      }

      @media (max-width: 420px) {
        #root input[placeholder="Search apiaries..."] + div > div.grid,
        #root input[placeholder="Search apiaries..."] + div > div > div.grid {
          grid-template-columns: 18px minmax(48px, 1fr) 70px 56px 56px !important;
          gap: 0.35rem !important;
        }

        #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(2) {
          grid-column: 1 / 3 !important;
          text-align: left !important;
        }

        #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(3),
        #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(4),
        #root input[placeholder="Search apiaries..."] + div > div.grid > span:nth-child(5) {
          font-size: 0.62rem !important;
          letter-spacing: 0 !important;
          text-align: center !important;
        }

        #root input[placeholder="Search apiaries..."] + div > div > div.grid {
          min-height: 3.6rem !important;
          padding-top: 0.85rem !important;
          padding-bottom: 0.85rem !important;
        }

        #root input[placeholder="Search apiaries..."] + div {
          overflow-x: hidden !important;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-neutral-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
